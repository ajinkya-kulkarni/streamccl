[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamccl"
version = "0.1.0"
description = "Storage-first connected-component labeling for large 2D/3D arrays"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ajinkya Kulkarni"}]
keywords = [
    "connected-components",
    "image-processing",
    "out-of-core",
    "zarr",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/ajinkya-kulkarni/streamccl"
Issues = "https://github.com/ajinkya-kulkarni/streamccl/issues"

[project.optional-dependencies]
zarr = ["zarr>=2.16,<4"]
test = ["pytest>=8", "zarr>=2.16,<4"]
benchmark = ["psutil>=5.9", "h5py>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
