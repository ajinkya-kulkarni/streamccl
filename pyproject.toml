[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamccl"
version = "0.1.0"
description = "Storage-first connected-component labeling for large 2D/3D arrays"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
zarr = ["zarr>=2.16,<4"]
test = ["pytest>=8", "zarr>=2.16,<4"]
benchmark = ["psutil>=5.9", "h5py>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
